name: 'Trigger Deploy Workflow'
description: 'Triggers deploy workflow based on detected changes (build, k8s, CloudFormation, config)'

inputs:
  build_container:
    description: 'Whether container was built (true/false)'
    required: true
  k8s_changed:
    description: 'Whether k8s files changed (true/false)'
    required: true
  cf_changed:
    description: 'Whether CloudFormation changed (true/false)'
    required: true
  config_changed_non_prod:
    description: 'Whether non-prod ConfigMap/Secret changed (true/false)'
    required: true
  config_changed_prod:
    description: 'Whether prod ConfigMap/Secret changed (true/false)'
    required: false
  tag:
    description: 'Image tag to deploy'
    required: true
  deploy_workflow:
    description: 'Override the deploy workflow filename (e.g. my-deploy.yml). Auto-detected if not set.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Trigger deploy workflow
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        BUILD_CHANGED="${{ inputs.build_container }}"
        K8S_CHANGED="${{ inputs.k8s_changed }}"
        CF_CHANGED="${{ inputs.cf_changed }}"
        CONFIG_CHANGED_NON_PROD="${{ inputs.config_changed_non_prod }}"
        CONFIG_CHANGED_PROD="${{ inputs.config_changed_prod }}"
        TAG="${{ inputs.tag }}"

        # Find deploy workflow — use override if provided, otherwise auto-detect
        # Uses file existence check (not `gh workflow view`) to avoid matching
        # deleted workflows that still exist in GitHub's history.
        if [[ -n "${{ inputs.deploy_workflow }}" ]]; then
          DEPLOY_WORKFLOW="${{ inputs.deploy_workflow }}"
          echo "Using deploy workflow (override): $DEPLOY_WORKFLOW"
        else
          DEPLOY_WORKFLOW=""
          for candidate in deploy.yml deploy.yaml; do
            if gh api "repos/${{ github.repository }}/contents/.github/workflows/${candidate}" &>/dev/null; then
              DEPLOY_WORKFLOW="$candidate"
              break
            fi
          done
          if [[ -z "$DEPLOY_WORKFLOW" ]]; then
            echo "ERROR: No deploy workflow found (.github/workflows/deploy.yml or deploy.yaml)"
            exit 1
          fi
          echo "Using deploy workflow (auto-detected): $DEPLOY_WORKFLOW"
        fi

        echo "=== Trigger Deploy ==="
        echo "Build changed: $BUILD_CHANGED"
        echo "K8s changed: $K8S_CHANGED"
        echo "CF changed: $CF_CHANGED"
        echo "Config changed (non-prod): $CONFIG_CHANGED_NON_PROD"
        echo "Config changed (prod): $CONFIG_CHANGED_PROD"
        echo "Tag: $TAG"
        echo ""

        # Track what we're triggering
        TRIGGERED_NON_PROD=""
        TRIGGERED_PROD=""

        if [[ "$BUILD_CHANGED" == "true" ]]; then
          # App code changed - deploy new image, only include CF if it changed
          SKIP_CF="true"
          [[ "$CF_CHANGED" == "true" ]] && SKIP_CF="false"

          echo "Triggering non-prod deploy with new image tag: $TAG"
          echo "  skip-cloudformation: $SKIP_CF"
          gh workflow run "$DEPLOY_WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --field tag="$TAG" \
            --field environment=non-prod \
            --field skip-cloudformation="$SKIP_CF" \
            --field restart-pods="$CONFIG_CHANGED_NON_PROD"
          TRIGGERED_NON_PROD="deploy new image (skip-cf=$SKIP_CF)"

        elif [[ "$K8S_CHANGED" == "true" || "$CF_CHANGED" == "true" ]]; then
          # K8s or CF only - skip image update
          SKIP_CF="true"
          [[ "$CF_CHANGED" == "true" ]] && SKIP_CF="false"

          echo "Triggering non-prod deploy (k8s/cf changes only)"
          echo "  skip-cloudformation: $SKIP_CF"
          echo "  restart-pods: $CONFIG_CHANGED_NON_PROD"

          gh workflow run "$DEPLOY_WORKFLOW" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref }}" \
            --field environment=non-prod \
            --field skip-image-update=true \
            --field skip-cloudformation="$SKIP_CF" \
            --field restart-pods="$CONFIG_CHANGED_NON_PROD"
          TRIGGERED_NON_PROD="k8s/cf only (restart-pods=$CONFIG_CHANGED_NON_PROD)"
        fi

        # Summary
        echo ""
        echo "=== Summary ==="
        if [[ -n "$TRIGGERED_NON_PROD" ]]; then
          echo "Non-prod: $TRIGGERED_NON_PROD"
        else
          echo "Non-prod: no deploy triggered"
        fi
        if [[ -n "$TRIGGERED_PROD" ]]; then
          echo "Prod: $TRIGGERED_PROD"
        else
          echo "Prod: no deploy triggered"
        fi
        echo "==============="